<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>જન્મદિવસની શુભેચ્છાઓ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Particles -->
    <div id="particles"></div>

    <!-- Confetti -->
    <div id="confetti"></div>

    <main class="birthday-card">

        <!-- Top Decoration -->
        <div class="top-glow"></div>

        <div class="small-title">
            ✨ શુભ પ્રસંગ ✨
        </div>

        <h1>
            જન્મદિવસની
            <span>હાર્દિક શુભેચ્છાઓ</span>
        </h1>

        <!-- Photo -->
        <div class="photo-area">

            <div class="photo-glow"></div>

            <div class="photo-frame">
                <img src="595394.jpg" alt="છત્રપાલભાઈ શિવરાજભાઈ ખાચર">
            </div>

        </div>

        <!-- Name -->
        <div class="name-area">

            <div class="name-line"></div>

            <h2>
                છત્રપાલભાઈ
                <br>
                શિવરાજભાઈ ખાચર
            </h2>

            <div class="name-line"></div>

        </div>

        <!-- Birthday Message -->
        <p class="message">
            આપને જન્મદિવસની હાર્દિક શુભેચ્છાઓ
            <br>
            આપનું જીવન સુખ, સમૃદ્ધિ અને સફળતાથી
            <br>
            હંમેશા ભરપૂર રહે તેવી શુભકામનાઓ.
        </p>

        <!-- Cake -->
        <div class="cake">

            <div class="flame"></div>

            <div class="candle"></div>

            <div class="cake-top"></div>

            <div class="cake-body">
                <span>🎂</span>
            </div>

        </div>

        <!-- Bottom -->
        <div class="bottom-text">
            ❤️ Happy Birthday ❤️
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
