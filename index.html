<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Chhatrapalbhai</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CINEMATIC INTRO -->
    <div id="intro">

        <div class="intro-glow"></div>

        <div class="intro-line"></div>

        <div class="intro-text">
            ✨ A SPECIAL DAY ✨
        </div>

    </div>


    <!-- BACKGROUND -->
    <div class="background">

        <div class="light light1"></div>
        <div class="light light2"></div>
        <div class="light light3"></div>

    </div>


    <!-- PARTICLES -->
    <div id="particles"></div>


    <!-- CONFETTI -->
    <div id="confetti"></div>


    <!-- MAIN CINEMATIC CARD -->

    <main class="birthday">

        <!-- TOP -->
        <div class="top">

            <div class="mini-title">
                ✨ SPECIAL BIRTHDAY ✨
            </div>

            <div class="gujarati-title">
                જન્મદિવસની
                <span>હાર્દિક શુભેચ્છાઓ</span>
            </div>

        </div>


        <!-- PHOTO SECTION -->

        <section class="photo-section">

            <!-- Rotating rings -->

            <div class="ring ring1"></div>
            <div class="ring ring2"></div>
            <div class="ring ring3"></div>


            <!-- Sparkles -->

            <div class="sparkle s1">✦</div>
            <div class="sparkle s2">✦</div>
            <div class="sparkle s3">✦</div>
            <div class="sparkle s4">✦</div>


            <!-- Photo -->

            <div class="photo-wrapper">

                <div class="photo-light"></div>

                <div class="photo-frame">

                    <img
                        src="chhatrapal.jpg"
                        alt="છત્રપાલભાઈ શિવરાજભાઈ ખાચર"
                    >

                    <div class="shine"></div>

                </div>

            </div>

        </section>


        <!-- NAME -->

        <section class="name-section">

            <div class="happy">
                🎂 HAPPY BIRTHDAY 🎂
            </div>


            <h1>
                છત્રપાલભાઈ
            </h1>

            <h2>
                શિવરાજભાઈ ખાચર
            </h2>

        </section>


        <!-- MESSAGE -->

        <section class="message">

            <p>
                આપનું જીવન હંમેશા ખુશીઓથી ભરેલું રહે,
                દરેક સપનું સાકાર થાય અને
                સફળતાના નવા શિખરો સર કરો.
            </p>

            <div class="wish">
                ❤️ જન્મદિવસની ખૂબ ખૂબ શુભેચ્છાઓ ❤️
            </div>

        </section>


        <!-- CAKE -->

        <div class="cake-area">

            <div class="cake">

                <div class="flame"></div>

                <div class="candle"></div>

                <div class="cake-top"></div>

                <div class="cake-body">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </div>


        <div class="bottom">
            ✨ Have A Wonderful Birthday ✨
        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
