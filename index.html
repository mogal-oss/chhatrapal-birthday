<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Chhatrapalbhai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Stars / particles -->
    <div id="particles"></div>

    <!-- Confetti -->
    <div id="confetti"></div>

    <!-- Main -->
    <main class="birthday-card">

        <div class="top-badge">
            ✨ SPECIAL DAY ✨
        </div>

        <div class="small-title">
            જન્મદિવસની હાર્દિક શુભેચ્છાઓ
        </div>

        <!-- Photo -->
        <div class="photo-area">

            <div class="photo-glow"></div>

            <div class="photo-frame">
                <img src="chhatrapal.jpg" alt="છત્રપાલભાઈ શિવરાજભાઈ ખાચર">
            </div>

        </div>

        <!-- Name -->
        <div class="name-area">

            <div class="wish-text">
                🎂 Happy Birthday 🎂
            </div>

            <h1>
                છત્રપાલભાઈ<br>
                <span>શિવરાજભાઈ ખાચર</span>
            </h1>

        </div>

        <!-- Message -->
        <div class="message">

            <p>
                આપનું જીવન હંમેશા ખુશીઓથી ભરેલું રહે,
                દરેક સપનું સાકાર થાય અને
                સફળતાના નવા શિખરો સર કરો.
            </p>

            <strong>
                જન્મદિવસની ખૂબ ખૂબ શુભેચ્છાઓ! ❤️
            </strong>

        </div>

        <!-- Cake -->
        <div class="cake">
            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="cake-top"></div>
            <div class="cake-body"></div>
            <div class="cake-bottom"></div>
        </div>

        <div class="bottom-text">
            💫 Have a Wonderful Birthday 💫
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
